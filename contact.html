<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Un avis ou un bug sur Monsieur Dossier ? Écrivez-nous. N’envoyez jamais vos documents.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>Contact — Monsieur Dossier</title>
<link rel="stylesheet" href="site.css?v=3">
<script src="theme.js"></script>
</head>
<body>

<nav id="nav">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Monsieur Dossier">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#2d5bd7"/><rect x="18" y="12" width="28" height="40" rx="3" fill="#fff"/><rect x="22" y="19" width="20" height="3" rx="1.5" fill="#cdd4e4"/><rect x="22" y="26" width="20" height="5" rx="1" fill="#1b1e24"/><rect x="22" y="35" width="14" height="3" rx="1.5" fill="#cdd4e4"/><path d="M32 45 L24.5 40.5 V49.5 Z M32 45 L39.5 40.5 V49.5 Z" fill="#1b1e24"/><circle cx="32" cy="45" r="2.2" fill="#1b1e24"/></svg>
      <span class="full">Monsieur Dossier</span><span class="short">M. Dossier</span>
    </a>
    <div class="lang" role="group" aria-label="Language" style="margin-left:auto">
      <button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap contact">
    <a class="back" href="./" data-i="back"></a>
    <div class="head">
      <span class="eyebrow" data-i="cEy"></span>
      <h1 data-i="cH"></h1>
      <p data-i="cP"></p>
    </div>

    <div class="warn"><div><b data-i="wT"></b><span data-i="wP"></span></div></div>

    <form class="card" id="form" novalidate hidden>
      <fieldset class="field">
        <legend data-i="kL"></legend>
        <div class="kinds">
          <label><input type="radio" name="type" value="avis" checked><span data-i="k1"></span></label>
          <label><input type="radio" name="type" value="bug"><span data-i="k2"></span></label>
          <label><input type="radio" name="type" value="question"><span data-i="k3"></span></label>
        </div>
      </fieldset>
      <div class="field">
        <label for="msg" data-i="mL"></label>
        <textarea id="msg" name="message" required maxlength="5000" aria-describedby="msgHint"></textarea>
        <span class="hint" id="msgHint" data-i="mHint"></span>
      </div>
      <div class="field">
        <label for="em" data-i="eL"></label>
        <input id="em" name="email" type="email" autocomplete="email" aria-describedby="emHint">
        <span class="hint" id="emHint" data-i="eHint"></span>
      </div>
      <div class="hp" aria-hidden="true"><label>Ne pas remplir <input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
      <div class="send">
        <button type="submit" class="btn primary" id="sendBtn" data-i="send"></button>
        <span class="err" id="err" role="alert" hidden></span>
      </div>
      <p class="fine" data-i="fine"></p>
    </form>

    <div class="done" id="done" role="status" tabindex="-1" hidden>
      <h2 data-i="okH"></h2>
      <p data-i="okP"></p>
    </div>

    <div class="mail" id="mail" hidden>
      <p><span id="mailLead"></span> <a id="mailLink"></a></p>
      <div class="mailrow" id="mailRow">
        <a class="btn primary" id="mailBtn" data-i="mailBtn"></a>
        <button type="button" class="btn" id="copyBtn"></button>
      </div>
      <p class="fine" id="mailFine" data-i="mailFine"></p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span data-i="foot1"></span>
    <span data-i="foot2"></span>
  </div>
</footer>

<script>
// À renseigner avant publication. Tant qu'une valeur est vide, le bloc correspondant reste masqué.
// FORM_ENDPOINT : adresse d'envoi du service de formulaires (POST, réponse JSON), par ex. "https://formspree.io/f/xxxxxxxx".
const FORM_ENDPOINT = "";
// CONTACT_EMAIL : adresse affichée en secours, par ex. "contact@monsieurdossier.com".
const CONTACT_EMAIL = "contact@monsieurdossier.com";

const T = {
fr:{
  back:"← Retour à l’accueil",
  title:"Contact — Monsieur Dossier",
  cEy:"Contact",
  cH:"Un avis, un bug ? Écrivez-nous.",
  cP:"Monsieur Dossier est une application jeune : vos retours décident de la suite. Dites-nous ce qui vous a aidé, ce qui vous a bloqué, ce qui manque.",
  wT:"N’envoyez jamais vos documents.",
  wP:"Ni pièce d’identité, ni bulletin de paie, ni capture d’écran d’un document, même en pièce jointe. Décrivez simplement le problème avec des mots.",
  kL:"Votre message concerne",
  k1:"Un avis", k2:"Un bug", k3:"Une question",
  mL:"Votre message",
  mHint:"Pour un bug : ce que vous faisiez, ce que vous attendiez, ce qui s’est passé, et votre version de macOS.",
  eL:"Votre e-mail (facultatif)",
  eHint:"Seulement si vous souhaitez une réponse. Il ne sert à rien d’autre.",
  send:"Envoyer", sending:"Envoi…",
  fine:"L’application, elle, n’envoie rien. Ce formulaire transmet votre message, et votre e-mail si vous l’indiquez, à notre prestataire de formulaires, qui nous le remet par e-mail. Aucun traceur sur cette page.",
  needMsg:"Écrivez votre message avant d’envoyer.",
  badMail:"Cette adresse e-mail ne semble pas valide. Corrigez-la ou laissez le champ vide.",
  fail:"L’envoi n’a pas abouti. Votre message est toujours là : réessayez",
  failMail:", ou écrivez-nous à ",
  okH:"Merci, c’est bien reçu.",
  okP:"Votre message est parti. Si vous avez laissé votre e-mail, nous vous répondrons.",
  mailForm:"Le formulaire ne fonctionne pas ? Écrivez-nous directement :",
  mailOnly:"Écrivez-nous à",
  mailBtn:"Écrire un e-mail", copy:"Copier l’adresse", copied:"Adresse copiée",
  subject:"Monsieur Dossier : avis ou bug",
  mailFine:"Pour un bug : ce que vous faisiez, ce que vous attendiez, ce qui s’est passé, et votre version de macOS. Si le bouton n’ouvre rien, copiez l’adresse et écrivez depuis votre messagerie habituelle.",
  foot1:"Monsieur Dossier — votre dossier de location, prêt et protégé.",
  foot2:"Application indépendante, non affiliée à l’État. L’application ne collecte aucune donnée."
},
en:{
  back:"← Back to home",
  title:"Contact — Monsieur Dossier",
  cEy:"Contact",
  cH:"Feedback or a bug? Write to us.",
  cP:"Monsieur Dossier is a young app: your feedback decides what comes next. Tell us what helped, what got in your way, what is missing.",
  wT:"Never send your documents.",
  wP:"No ID, no payslip, no screenshot of a document, not even as an attachment. Just describe the problem in words.",
  kL:"Your message is about",
  k1:"Feedback", k2:"A bug", k3:"A question",
  mL:"Your message",
  mHint:"For a bug: what you were doing, what you expected, what happened, and your macOS version.",
  eL:"Your email (optional)",
  eHint:"Only if you would like a reply. It is used for nothing else.",
  send:"Send", sending:"Sending…",
  fine:"The app itself sends nothing. This form passes your message, and your email if you give it, to our form provider, which delivers it to us by email. No trackers on this page.",
  needMsg:"Write your message before sending.",
  badMail:"This email address does not look valid. Fix it or leave the field empty.",
  fail:"Your message was not sent. It is still here: try again",
  failMail:", or write to us at ",
  okH:"Thank you, we got it.",
  okP:"Your message has been sent. If you left your email, we will reply.",
  mailForm:"Form not working? Write to us directly:",
  mailOnly:"Write to us at",
  mailBtn:"Write an email", copy:"Copy the address", copied:"Address copied",
  subject:"Monsieur Dossier: feedback or bug",
  mailFine:"For a bug: what you were doing, what you expected, what happened, and your macOS version. If the button opens nothing, copy the address and write from your usual mailbox.",
  foot1:"Monsieur Dossier — your French rental file, ready and protected.",
  foot2:"Independent app, not affiliated with the French government. The app collects no data."
}};

let lang = "fr";
try { const s = localStorage.getItem("monsieurdossier-site-lang"); if (s === "fr" || s === "en") lang = s; else if (!(navigator.language || "").startsWith("fr")) lang = "en"; } catch (e) {}

const form = document.getElementById("form"), done = document.getElementById("done"), mail = document.getElementById("mail");
const err = document.getElementById("err"), sendBtn = document.getElementById("sendBtn");
const copyBtn = document.getElementById("copyBtn");
let sending = false, sent = false, errKey = null, copied = false;

function showErr(){
  err.hidden = !errKey; err.textContent = "";
  if (!errKey) return;
  const L = T[lang];
  err.appendChild(document.createTextNode(L[errKey]));
  if (errKey === "fail"){
    if (CONTACT_EMAIL){
      err.appendChild(document.createTextNode(L.failMail));
      const a = document.createElement("a"); a.href = "mailto:" + CONTACT_EMAIL; a.textContent = CONTACT_EMAIL; err.appendChild(a);
    }
    err.appendChild(document.createTextNode("."));
  }
}

function render(){
  const L = T[lang];
  document.documentElement.lang = lang; document.title = L.title;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = L[el.dataset.i]; });
  sendBtn.textContent = sending ? L.sending : L.send;
  form.hidden = !FORM_ENDPOINT || sent;
  done.hidden = !sent;
  mail.hidden = !CONTACT_EMAIL;
  document.getElementById("mailLead").textContent = FORM_ENDPOINT ? L.mailForm : L.mailOnly;
  const a = document.getElementById("mailLink"); a.href = "mailto:" + CONTACT_EMAIL; a.textContent = CONTACT_EMAIL;
  // Sans formulaire, l'e-mail est le moyen principal : bouton, copie de l'adresse et conseils.
  document.getElementById("mailRow").hidden = document.getElementById("mailFine").hidden = !!FORM_ENDPOINT;
  document.getElementById("mailBtn").href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent(L.subject);
  copyBtn.textContent = copied ? L.copied : L.copy;
  showErr();
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (sending) return;
  const msg = form.elements.message, em = form.elements.email;
  if (!msg.value.trim()){ errKey = "needMsg"; showErr(); msg.focus(); return; }
  if (em.value.trim() && !em.checkValidity()){ errKey = "badMail"; showErr(); em.focus(); return; }
  errKey = null; sending = true; sendBtn.disabled = true; render();
  let ok = false;
  try {
    const r = await fetch(FORM_ENDPOINT, { method:"POST", body:new FormData(form), headers:{ Accept:"application/json" } });
    ok = r.ok;
  } catch (x) {}
  sending = false; sendBtn.disabled = false;
  if (ok){ sent = true; render(); done.focus(); }
  else { errKey = "fail"; render(); }
});

copyBtn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(CONTACT_EMAIL); copied = true; render(); setTimeout(() => { copied = false; render(); }, 2500); } catch (e) {}
});

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; try { localStorage.setItem("monsieurdossier-site-lang", lang); } catch (e) {} render();
}));
const nav = document.getElementById("nav");
addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive:true });
render();
</script>
</body>
</html>
