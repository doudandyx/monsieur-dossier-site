let lang = "fr";
try { const s = localStorage.getItem("monsieurdossier-site-lang"); if (s === "fr" || s === "en") lang = s; else if (!(navigator.language || "").startsWith("fr")) lang = "en"; } catch (e) {}

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* Illustrations : des fragments d'écran simplifiés, dessinés en HTML, avec des documents fictifs. Aucun texte ne vient de l'extérieur. */
const row = (a, b) => `<div class="row"><span>${a}</span>${b || ""}</div>`;
const tag = (t, c) => `<span class="tag ${c || ""}">${t}</span>`;
const bar = w => `<span class="bar" style="width:100%;max-width:${w}px"></span>`;
const lines = n => "<i></i>".repeat(n);
const MOCK = {
  ajouter: M => `<div class="mk">${[0,1,2,3,3].map((c, i) => row(`<span class="file">${M.files[i]}</span>`, tag(M.cat[c]))).join("")}${row(`<span class="file">${M.files[5]}</span>`, tag(M.notDue, "no"))}</div>`,
  manque: M => `<div class="mk"><h5>${M.listT}</h5>${M.list.map((t, i) => row(t, i === 4 ? tag(M.miss, "no") : tag(M.ok, "ok"))).join("")}</div>`,
  masquer: M => `<div class="mk"><h5>${M.doc}</h5>
    <div class="row"><span class="k">${M.name}</span><span class="v">Camille MARTIN</span></div>
    <div class="row"><span class="k">${M.secu}</span><span class="v">${bar(120)}</span>${tag(M.hid)}</div>
    <div class="row"><span class="k">${M.net}</span><span class="v">2 450,00 €</span></div>
    <div class="row"><span class="k">IBAN</span><span class="v">${bar(150)}</span>${tag(M.hid)}</div>
    <div class="row"><span class="k">BIC</span><span class="v">${bar(70)}</span>${tag(M.hid)}</div></div>`,
  pages: M => `<div class="mk"><div class="pgs">${[1,2,3,4].map(n => `<div class="pgc"><div class="pg${n > 2 ? " off" : ""}" style="width:100%">${lines(7)}</div>${n > 2 ? tag(M.off, "no") : n}</div>`).join("")}</div></div>`,
  filigrane: M => `<div class="mk"><div class="field"><small>${M.to}</small>${M.toV}</div><div class="field"><small>${M.addr}</small>${M.addrV}</div>
    <div class="prev">${lines(9)}<div class="w">${`<span>${M.wm}</span>`.repeat(9)}</div></div></div>`,
  controle: M => `<div class="mk">${M.out.map(t => row(`<span class="file">${t}</span>`, tag("✓ " + M.checked, "ok"))).join("")}<div class="sum">${M.sum}</div></div>`,
  enregistrer: M => `<div class="mk">${row(`<span class="dir"><b>${M.dir}</b></span>`)}${M.out.map(t => row(`<span class="file in">${t}</span>`)).join("")}</div>`,
  mac: M => `<div class="mk term"><span class="c">${M.term}</span><br><span class="q">$</span> lsof -i -a -c Monsieur<br>COMMAND&nbsp;&nbsp;&nbsp;TYPE&nbsp;&nbsp;NAME<br>Monsieur&nbsp;&nbsp;IPv4&nbsp;&nbsp;<span class="g">127.0.0.1:49716 (LISTEN)</span><br><span class="c">${M.term2}</span></div>`
};

function render(){
  const L = T[lang];
  document.documentElement.lang = lang; document.title = L.title;
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = L[e.dataset.i]; });
  const toc = document.getElementById("toc"), feats = document.getElementById("feats");
  toc.innerHTML = ""; feats.innerHTML = "";
  L.feats.forEach((f, i) => {
    const a = el("a", "", f.short); a.href = "#" + f.id; toc.appendChild(a);
    const s = el("section", "feat"); s.id = f.id;
    const txt = el("div", "txt");
    txt.appendChild(el("div", "n", String(i + 1).padStart(2, "0")));
    txt.appendChild(el("h2", "", f.h));
    txt.appendChild(el("p", "", f.p));
    const ul = el("ul");
    f.pts.forEach(([b, rest]) => { const li = el("li"); li.appendChild(el("b", "", b)); li.appendChild(document.createTextNode(" " + rest)); ul.appendChild(li); });
    txt.appendChild(ul);
    if (f.note) txt.appendChild(el("p", "note", L.noteLab + f.note));
    const shot = el("div", "shot"); shot.setAttribute("role", "img"); shot.setAttribute("aria-label", f.shot);
    shot.innerHTML = MOCK[f.id](L.mk); shot.firstElementChild.setAttribute("aria-hidden", "true");
    s.appendChild(txt); s.appendChild(shot); feats.appendChild(s);
  });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; try { localStorage.setItem("monsieurdossier-site-lang", lang); } catch (e) {} render();
}));
const nav = document.getElementById("nav");
addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive:true });
render();
</script>
