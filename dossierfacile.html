<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Monsieur Dossier complète DossierFacile, le service de l’État : ce que fait chacun, et comment les utiliser ensemble.">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>Monsieur Dossier et DossierFacile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of "dossier" sheets on a cool paper desk; the hero is a live document you can protect. */
:root{
  --paper:#eef1f6;      /* desk */
  --sheet:#ffffff;      /* document */
  --ink:#14213d;        /* text */
  --ink-2:#55607a;      /* secondary text */
  --rule:#d6dbe6;
  --accent:#2d5bd7;     /* watermark blue (app icon) */
  --accent-ink:#ffffff;
  --mask:#1b1e24;       /* redaction */
  --ok:#1d8150;
  --no:#c2412f;
  --wm:rgba(45,91,215,.16);
  --shadow:0 1px 1px rgba(20,33,61,.06),0 12px 40px rgba(20,33,61,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1420; --sheet:#182033; --ink:#e7ebf4; --ink-2:#9aa5bd; --rule:#2a3550;
    --accent:#7b9bff; --accent-ink:#0b1022; --mask:#05070b; --ok:#4cc38a; --no:#ff7a66;
    --wm:rgba(123,155,255,.16); --shadow:0 1px 1px #0006,0 12px 40px #0007; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1420; --sheet:#182033; --ink:#e7ebf4; --ink-2:#9aa5bd; --rule:#2a3550;
  --accent:#7b9bff; --accent-ink:#0b1022; --mask:#05070b; --ok:#4cc38a; --no:#ff7a66;
  --wm:rgba(123,155,255,.16); --shadow:0 1px 1px #0006,0 12px 40px #0007; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 var(--f-body);padding:14px 20px;border-radius:12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.btn small{font-weight:500;opacity:.8}

/* ---------- nav ---------- */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
nav.scrolled{border-bottom-color:var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav .wrap{display:flex;align-items:center;gap:20px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font:800 19px/1 var(--f-display);color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.brand svg{flex:none}
nav .links{display:flex;gap:22px;margin-left:auto;font-size:14.5px}
nav .links a{color:var(--ink-2);text-decoration:none}
.brand,nav .links a,nav .btn{white-space:nowrap}
@media (max-width:1100px){ nav .links{display:none} nav .lang{margin-left:auto} }
nav .links a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--rule);border-radius:9px;padding:2px;background:var(--sheet)}
.lang button{border:0;background:transparent;font:600 12.5px/1 var(--f-body);color:var(--ink-2);padding:6px 9px;border-radius:7px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- hero ---------- */
.hero{padding-block:56px 72px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,68px);line-height:1.02;font-weight:800;margin:14px 0 18px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 28%,transparent) 62%)}
.hero .lede{font-size:18.5px;color:var(--ink-2);max-width:34em}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:13.5px;color:var(--ink-2)}
.facts span{display:flex;align-items:center;gap:7px}
.facts svg{color:var(--ok)}

/* the live document */
.demo{position:relative}
.sheet{position:relative;background:var(--sheet);border-radius:6px;box-shadow:var(--shadow);padding:34px 34px 30px;overflow:hidden;aspect-ratio:1/1.3;max-width:100%;font-size:13px;transform:rotate(1.2deg)}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.sheet .hd b{font:700 15px/1.2 var(--f-display);letter-spacing:.01em}
.sheet .hd small{display:block;color:var(--ink-2);font-size:11px;margin-top:4px}
.sheet .bank{font:700 11px/1 var(--f-body);letter-spacing:.14em;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:9px 12px;align-items:baseline}
.kv dt{color:var(--ink-2);font-size:11.5px}
.kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;position:relative;justify-self:start}
.sec{margin-top:18px;padding-top:12px;border-top:1px dashed var(--rule)}
.sec h4{margin:0 0 8px;font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.qr{width:62px;height:62px;position:absolute;right:30px;bottom:28px;background:
  conic-gradient(from 90deg at 30% 30%,var(--ink) 25%,transparent 0) 0 0/12px 12px,
  conic-gradient(from 0deg at 70% 60%,var(--ink) 25%,transparent 0) 3px 5px/9px 9px;opacity:.85;border:4px solid var(--sheet);outline:2px solid var(--ink)}
.qr-l{position:absolute;right:30px;bottom:12px;font-size:9.5px;color:var(--ink-2);width:62px;text-align:center}
/* masks */
.m::after{content:"";position:absolute;inset:-3px -5px;background:var(--mask);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.6,.05,.25,1)}
.sheet.on .m::after{transform:scaleX(1)}
.sheet.on .m:nth-of-type(2)::after{transition-delay:.08s}
/* watermark */
.wm{position:absolute;inset:-40%;display:flex;flex-direction:column;justify-content:center;gap:34px;transform:rotate(-28deg);pointer-events:none;opacity:0;transition:opacity .6s .35s}
.sheet.on .wm{opacity:1}
.wm div{white-space:nowrap;font:700 15px/1 var(--f-body);color:var(--wm);letter-spacing:.02em}
.wm div:nth-child(even){margin-left:-140px}
.toggle{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);display:flex;background:var(--ink);border-radius:999px;padding:4px;box-shadow:var(--shadow);z-index:2}
.toggle button{border:0;background:transparent;color:color-mix(in srgb,var(--paper) 70%,transparent);font:600 13.5px/1 var(--f-body);padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.toggle button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.stamp{position:absolute;top:18px;right:-10px;z-index:2;transform:rotate(8deg);font:800 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ok);border:2px solid var(--ok);padding:7px 10px;border-radius:6px;background:var(--sheet);opacity:0;transition:opacity .3s .7s}
.demo.on .stamp{opacity:1}

/* ---------- sections ---------- */
section.block{padding-block:84px}
.head{max-width:640px;margin-bottom:40px}
.head h2{font-size:clamp(30px,4vw,44px);line-height:1.08;font-weight:800;margin-top:12px}
.head p{color:var(--ink-2);font-size:17px;margin-top:14px}
.band{background:var(--sheet);border-block:1px solid var(--rule)}

/* problem */
.prob{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.prob article{border-top:2px solid var(--ink);padding-top:18px;min-width:0}
.prob h3{font-size:20px;margin-bottom:8px}
.prob p{color:var(--ink-2);font-size:15px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{background:var(--paper);border-radius:14px;padding:22px;min-width:0;position:relative}
.step .n{font:800 44px/1 var(--f-display);color:var(--accent);letter-spacing:-.04em}
.step h3{font-size:18px;margin:14px 0 6px}
.step p{font-size:14.5px;color:var(--ink-2)}
.step .ui{margin-top:16px;height:64px;border-radius:9px;background:var(--sheet);border:1px solid var(--rule);display:grid;place-items:center;font:500 11.5px/1.3 var(--f-mono);color:var(--ink-2);text-align:center;padding:8px}

/* privacy */
.priv{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checks li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--rule)}
.checks li:last-child{border-bottom:0}
.checks b{display:block;font-weight:600}
.checks span{color:var(--ink-2);font-size:14.5px}
.checks svg{color:var(--ok);margin-top:3px}
.terminal{background:#0d1220;color:#c9d3ea;border-radius:14px;padding:22px;font:13px/1.7 var(--f-mono);box-shadow:var(--shadow);overflow-x:auto}
.terminal .c{color:#6f7d9c}
.terminal .g{color:#6ee7a8}
.terminal .k{color:#9fb6ff}

/* legal */
.legal{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.list{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:26px;min-width:0}
.list h3{font-size:19px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.list ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.list li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:15px}
.list.ok li::before{content:"✓";color:var(--ok);font-weight:700}
.list.no li::before{content:"✕";color:var(--no);font-weight:700}
.pill{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.list.ok .pill{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.list.no .pill{background:color-mix(in srgb,var(--no) 14%,transparent);color:var(--no)}
.src{font-size:13px;color:var(--ink-2);margin-top:18px}

/* download */
.dl{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;background:var(--ink);color:var(--paper);border-radius:22px;padding:44px}
.dl h2{font-size:clamp(28px,3.6vw,40px);font-weight:800}
.dl p{color:color-mix(in srgb,var(--paper) 72%,transparent);margin-top:10px}
.dl .btn.primary{background:var(--paper);border-color:var(--paper);color:var(--ink);margin-top:22px}
.dl .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:color-mix(in srgb,var(--paper) 62%,transparent)}
.dl-note{margin-top:14px;font-size:13.5px;color:color-mix(in srgb,var(--paper) 80%,transparent)}
.dl-icon{width:132px;height:132px;border-radius:30px;background:linear-gradient(#2d5bd7,#1e3ca0);display:grid;place-items:center;box-shadow:0 18px 40px #0005}
.first{margin-top:22px;border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent);padding-top:18px;font-size:14px;color:color-mix(in srgb,var(--paper) 78%,transparent)}
.first ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}

/* faq */
.faq{display:grid;gap:10px;max-width:820px}
details{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:4px 20px}
summary{cursor:pointer;font-weight:600;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 22px/1 var(--f-display);color:var(--accent);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--ink-2);padding:0 0 18px;font-size:15px;max-width:65ch}

/* with DossierFacile */
.cmp{border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--paper)}
.cmp .r{display:grid;grid-template-columns:180px 1fr 1fr;border-top:1px solid var(--rule)}
.cmp .r:first-child{border-top:0}
.cmp .r>*{padding:14px 18px;min-width:0;font-size:15px}
.cmp .r>:first-child{color:var(--ink-2);font-size:13.5px;font-weight:600}
.cmp .r>:last-child{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:500}
.cmp .hd>*{font:700 17px/1.2 var(--f-display)!important;color:var(--ink)!important}
.cmp .lab{display:none;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
.together{margin-top:36px}
.prob.four{grid-template-columns:repeat(4,1fr)}
.brand .short{display:none}

/* "coming soon" dialog */
button.btn{font-family:var(--f-body)}
dialog#soon{border:0;border-radius:20px;padding:0;background:var(--sheet);color:var(--ink);box-shadow:var(--shadow);width:min(440px,calc(100vw - 32px))}
dialog#soon::backdrop{background:rgba(10,16,32,.55);backdrop-filter:blur(3px)}
.soon{padding:32px 28px 28px;position:relative}
.soon h2{font-size:28px;line-height:1.1;font-weight:800;margin:10px 0 10px}
.soon .su-p{color:var(--ink-2);margin-bottom:22px}
.soon .x{position:absolute;top:12px;right:14px;border:0;background:transparent;color:var(--ink-2);font:400 26px/1 var(--f-body);cursor:pointer;padding:6px 10px;border-radius:8px}

footer{padding-block:40px 56px;color:var(--ink-2);font-size:13.5px}
footer a{color:inherit}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:24px}

@media (max-width:900px){
  .hero .wrap,.priv,.legal{grid-template-columns:1fr}
  .hero .wrap{gap:56px}
  .steps{grid-template-columns:1fr 1fr}
  .prob,.prob.four{grid-template-columns:1fr}
  .prob.four{grid-template-columns:1fr 1fr}
  nav .links{display:none}
  .lang{margin-left:auto}
  .dl{grid-template-columns:1fr;padding:32px 24px}
  .dl-icon{width:88px;height:88px;border-radius:22px}
}
@media (max-width:680px){
  .cmp .r{grid-template-columns:1fr}
  .cmp .r.hd{display:none}
  .cmp .r>:first-child{padding-bottom:0;font-size:15px;color:var(--ink)}
  .cmp .lab{display:block}
}
@media (max-width:520px){
  .prob.four{grid-template-columns:1fr}
  .brand .full{display:none}
  .brand .short{display:inline}
  .steps{grid-template-columns:1fr}
  .sheet{padding:24px 20px;transform:none}
  .kv{grid-template-columns:96px 1fr}
  section.block{padding-block:60px}
  .hero{padding-block:28px 64px}
  .hero .cta .btn{flex:1 1 100%;justify-content:center}
  .stamp{top:-14px;right:8px;font-size:11.5px}
  .lang button{padding:9px 11px}
  .list{padding:22px 18px}
  .list h3{flex-wrap:wrap;gap:8px}
  .dl{padding:28px 20px;border-radius:18px}
  .terminal{font-size:12px;padding:18px}
  .wm div:nth-child(even){margin-left:-80px}
}
@media (max-width:360px){
  nav .wrap{gap:10px}
  .brand{font-size:17px;gap:8px}
  nav .btn.primary{padding:9px 11px!important;font-size:13px!important}
  .lang button{padding:8px 8px}
  .kv{grid-template-columns:84px 1fr}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
<style>
.page{padding-block:44px 84px}
.back{display:inline-block;margin-bottom:28px;font-size:14.5px;color:var(--ink-2);text-decoration:none}
.back:hover{color:var(--ink)}
.page .cmp{background:var(--sheet)}
</style>
</head>
<body>

<nav id="nav">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Monsieur Dossier">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#2d5bd7"/><rect x="18" y="12" width="28" height="40" rx="3" fill="#fff"/><rect x="22" y="19" width="20" height="3" rx="1.5" fill="#cdd4e4"/><rect x="22" y="26" width="20" height="5" rx="1" fill="#1b1e24"/><rect x="22" y="35" width="14" height="3" rx="1.5" fill="#cdd4e4"/><path d="M32 45 L24.5 40.5 V49.5 Z M32 45 L39.5 40.5 V49.5 Z" fill="#1b1e24"/><circle cx="32" cy="45" r="2.2" fill="#1b1e24"/></svg>
      <span class="full">Monsieur Dossier</span><span class="short">M. Dossier</span>

    <div class="lang" role="group" aria-label="Language" style="margin-left:auto">
      <button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <a class="back" href="./" data-i="back"></a>
    <div class="head">
      <span class="eyebrow" data-i="dfEy"></span>
      <h1 data-i="dfH" style="font-size:clamp(30px,4vw,44px);line-height:1.08;font-weight:800;margin-top:12px"></h1>
      <p data-i="dfP"></p>
    </div>
    <div class="cmp" id="cmp"></div>
    <div class="prob together">
      <article><h3 data-i="t1h"></h3><p data-i="t1p"></p></article>
      <article><h3 data-i="t2h"></h3><p data-i="t2p"></p></article>
      <article><h3 data-i="t3h"></h3><p data-i="t3p"></p></article>
    </div>
    <p class="src" data-i="dfSrc"></p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span data-i="foot1"></span>
    <span data-i="foot2"></span>
    <a href="contact.html" data-i="footC"></a>
  </div>
</footer>

},
en:{
  back:"← Back to home",
  title:"Monsieur Dossier and DossierFacile",

  cmp:[

    ["Verification","Yes: a government “verified” label","No: nothing is certified"],

let lang = "fr";
try { const s = localStorage.getItem("monsieurdossier-site-lang"); if (s === "fr" || s === "en") lang = s; else if (!(navigator.language || "").startsWith("fr")) lang = "en"; } catch (e) {}

function render(){
  const L = T[lang];
  document.documentElement.lang = lang; document.title = L.title;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = L[el.dataset.i]; });
  const cmp = document.getElementById("cmp"); cmp.innerHTML = "";
  [L.cmpHd, ...L.cmp].forEach((row, i) => { const r = document.createElement("div"); r.className = i ? "r" : "r hd";
    row.forEach((txt, j) => { const c = document.createElement("div");
      if (i && j){ const l = document.createElement("span"); l.className = "lab"; l.textContent = L.cmpHd[j]; c.appendChild(l); }
      c.appendChild(document.createTextNode(txt)); r.appendChild(c); });
    cmp.appendChild(r); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; try { localStorage.setItem("monsieurdossier-site-lang", lang); } catch (e) {} render();
}));
const nav = document.getElementById("nav");
addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive:true });
render();
</script>
