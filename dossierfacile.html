<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Monsieur Dossier complète DossierFacile, le service de l’État : ce que fait chacun, et comment les utiliser ensemble.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>Monsieur Dossier et DossierFacile</title>
<link rel="stylesheet" href="site.css?v=4">
<script src="theme.js"></script>
</head>
<body>

<nav id="nav">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Monsieur Dossier">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="14" fill="#2d5bd7"/><rect x="18" y="12" width="28" height="40" rx="3" fill="#fff"/><rect x="22" y="19" width="20" height="3" rx="1.5" fill="#cdd4e4"/><rect x="22" y="26" width="20" height="5" rx="1" fill="#1b1e24"/><rect x="22" y="35" width="14" height="3" rx="1.5" fill="#cdd4e4"/><path d="M32 45 L24.5 40.5 V49.5 Z M32 45 L39.5 40.5 V49.5 Z" fill="#1b1e24"/><circle cx="32" cy="45" r="2.2" fill="#1b1e24"/></svg>
      <span class="full">Monsieur Dossier</span><span class="short">M. Dossier</span>
    </a>
    <div class="lang" role="group" aria-label="Language" style="margin-left:auto">
      <button type="button" data-l="fr">FR</button><button type="button" data-l="en">EN</button>
    </div>
  </div>
</nav>

<main class="page">
  <div class="wrap">
    <a class="back" href="./" data-i="back"></a>
    <div class="head">
      <span class="eyebrow" data-i="dfEy"></span>
      <h1 data-i="dfH"></h1>
      <p data-i="dfP"></p>
    </div>
    <div class="cmp" id="cmp"></div>
    <div class="prob together">
      <article><h3 data-i="t1h"></h3><p data-i="t1p"></p></article>
      <article><h3 data-i="t2h"></h3><p data-i="t2p"></p></article>
      <article><h3 data-i="t3h"></h3><p data-i="t3p"></p></article>
    </div>
    <p class="src" data-i="dfSrc"></p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span data-i="foot1"></span>
    <span data-i="foot2"></span>
    <a href="contact.html" data-i="footC"></a>
  </div>
</footer>

<script>
const T = {
fr:{
  back:"← Retour à l’accueil",
  title:"Monsieur Dossier et DossierFacile",
  dfEy:"Avec DossierFacile",
  dfH:"Le complément de DossierFacile, pas son concurrent.",
  dfP:"DossierFacile, le service gratuit de l’État, vérifie votre dossier et le partage par lien. Monsieur Dossier protège les fichiers que vous envoyez vous-même, quand le lien n’est pas accepté ou qu’on vous demande des pièces jointes.",
  cmpHd:["","DossierFacile","Monsieur Dossier"],
  cmp:[
    ["Son rôle","Vérifier votre dossier et le partager","Préparer et protéger vos fichiers"],
    ["Vos documents","Déposés sur les serveurs de l’État, avec un compte","Restent sur votre Mac, sans compte"],
    ["Vérification","Oui : label « vérifié » par l’État","Non : aucune certification"],
    ["Partage","Lien par destinataire, révocable","Des fichiers à joindre vous-même"],
    ["Données masquées","Aucune : pièces complètes exigées","IBAN, RIB, n° de sécu, MRZ, et vos zones"],
    ["Filigrane","Mention fixe, sans nom ni date","Destinataire, adresse et date"],
    ["Langue","Français","Français et anglais"]
  ],
  t1h:"1. Faites vérifier",
  t1p:"Créez votre DossierFacile et partagez son lien quand le bailleur l’accepte.",
  t2h:"2. Protégez le reste",
  t2p:"On vous demande des fichiers par e-mail ou sur un portail ? Préparez-les avec Monsieur Dossier.",
  t3h:"3. Laissez le vérifiable",
  t3p:"Ne masquez jamais le numéro fiscal, la référence de l’avis d’imposition, les QR codes ni votre photo.",
  dfSrc:"Monsieur Dossier est une application indépendante. Elle n’est ni un service de l’État ni affiliée à DossierFacile, et ne vérifie pas l’authenticité de vos pièces.",
  foot1:"Monsieur Dossier — votre dossier de location, prêt et protégé.",
  foot2:"Application indépendante, non affiliée à l’État. Aucune donnée collectée.", footC:"Un avis, un bug ? Écrivez-nous"
},
en:{
  back:"← Back to home",
  title:"Monsieur Dossier and DossierFacile",
  dfEy:"With DossierFacile",
  dfH:"It works alongside DossierFacile, not against it.",
  dfP:"DossierFacile, the French government’s free service, verifies your file and shares it by link. Monsieur Dossier protects the files you send yourself, when the link isn’t accepted or you’re asked for attachments.",
  cmpHd:["","DossierFacile","Monsieur Dossier"],
  cmp:[
    ["Its job","Verify your file and share it","Prepare and protect your files"],
    ["Your documents","Uploaded to government servers, with an account","Stay on your Mac, no account"],
    ["Verification","Yes: a government “verified” label","No: nothing is certified"],
    ["Sharing","One revocable link per recipient","Files you attach yourself"],
    ["Hidden data","None: complete documents required","IBAN, bank codes, social security no., MRZ, plus your own areas"],
    ["Watermark","Fixed wording, no name or date","Recipient, address and date"],
    ["Language","French","English and French"]
  ],
  t1h:"1. Get verified",
  t1p:"Create your DossierFacile and share its link whenever the landlord accepts it.",
  t2h:"2. Protect the rest",
  t2p:"Asked for files by email or on a portal? Prepare them with Monsieur Dossier.",
  t3h:"3. Keep what’s checkable",
  t3p:"Never hide your tax number, the tax notice reference, QR codes or your photo.",
  dfSrc:"Monsieur Dossier is an independent app. It is not a government service, is not affiliated with DossierFacile, and does not check that your documents are genuine.",
  foot1:"Monsieur Dossier — your French rental file, ready and protected.",
  foot2:"Independent app, not affiliated with the French government. No data collected.", footC:"Feedback or a bug? Contact us"
}};

let lang = "fr";
try { const s = localStorage.getItem("monsieurdossier-site-lang"); if (s === "fr" || s === "en") lang = s; else if (!(navigator.language || "").startsWith("fr")) lang = "en"; } catch (e) {}

function render(){
  const L = T[lang];
  document.documentElement.lang = lang; document.title = L.title;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = L[el.dataset.i]; });
  const cmp = document.getElementById("cmp"); cmp.innerHTML = "";
  [L.cmpHd, ...L.cmp].forEach((row, i) => { const r = document.createElement("div"); r.className = i ? "r" : "r hd";
    row.forEach((txt, j) => { const c = document.createElement("div");
      if (i && j){ const l = document.createElement("span"); l.className = "lab"; l.textContent = L.cmpHd[j]; c.appendChild(l); }
      c.appendChild(document.createTextNode(txt)); r.appendChild(c); });
    cmp.appendChild(r); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; try { localStorage.setItem("monsieurdossier-site-lang", lang); } catch (e) {} render();
}));
const nav = document.getElementById("nav");
addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive:true });
render();
</script>
</body>
</html>
